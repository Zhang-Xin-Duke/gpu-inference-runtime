[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "bounded-gpu-runtime"
version = "0.1.0"
description = "Bounded dynamic batching and event-driven execution for GPU inference"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.26"]
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=8"]
bench = ["matplotlib>=3.8"]
cuda-build = ["ninja>=1.11"]

[project.scripts]
gpu-runtime-service = "gpu_runtime.service:main"

[tool.scikit-build]
wheel.packages = ["src/gpu_runtime"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an NVIDIA GPU"]
